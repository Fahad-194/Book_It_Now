<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Bus Route</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #f9fafb;
        }
        header {
            background-color: #333;
            color: white;
            padding: 20px 60px;
            font-size: 17px;
        }
         .navbar a {
            color: white;  /* Sets the text color of the link to white */
            text-decoration: none; /* Removes underline from the link */
        }

        .navbar a:hover {
            color: red; /* Optionally, change the color when hovering */
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .form-container {
            background: white;
            padding: 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            width: 60%;
            margin: 0 auto;
        }
        .form-container h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        .form-container label {
            display: block;
            margin: 10px 0 5px;
            font-size: 16px;
        }
        .form-container input,
        .form-container select {
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .form-container button {
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        .form-container button:hover {
            background-color: #218838;
        }
        .back-btn {
            display: block;
            margin-top: 20px;
            text-align: center;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .back-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <header>
        <div class="navbar">
            <a href="{% url 'employee_dashboard' %}">Employee Dashboard</a>
        </div>
    </header>

    <main>
        <div class="form-container">
            <h1>Create Bus Route</h1>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit"><h3>Create Route</h3></button>
            </form>
            <a href="{% url 'bus_routes' %}" class="back-btn">Back to Routes</a>
        </div>
    </main>
</body>
</html>
