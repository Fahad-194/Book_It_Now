<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Bus Route</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #f9fafb;
        }
        header {
            background-color: #333;
            color: white;
            padding: 20px 60px;
            font-size: 17px;
        }
         .navbar a {
            color: white;  /* Sets the text color of the link to white */
            text-decoration: none; /* Removes underline from the link */
        }

        .navbar a:hover {
            color: red; /* Optionally, change the color when hovering */
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .confirmation-container {
            background: white;
            padding: 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            width: 60%;
            margin: 0 auto;
            text-align: center;
        }
        .confirmation-container h1 {
            margin-bottom: 20px;
        }
        .confirmation-container p {
            font-size: 18px;
            margin-bottom: 20px;
        }
        .confirmation-container button {
            padding: 10px 20px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }
        .confirmation-container button:hover {
            background-color: #c82333;
        }
        .back-btn {
            display: block;
            margin-top: 20px;
            text-align: center;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .back-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <header>
        <div class="navbar">
            <a href="{% url 'employee_dashboard' %}">Employee Dashboard</a>
        </div>
    </header>

    <main>
        <div class="confirmation-container">
            <h1>Are you sure you want to delete this bus route?</h1>
            <p><strong>{{ route.origin }} to {{ route.destination }}</strong></p>
            <p><strong>Departure Time:</strong> {{ route.departure_time }}</p>
            <p><strong>Seats Available:</strong> {{ route.available_seats }}</p>
            <p><strong>Price:</strong> ${{ route.price }}</p>

            <form method="POST">
                {% csrf_token %}
                <button type="submit">Yes, Delete</button>
            </form>
            <a href="{% url 'bus_routes' %}" class="back-btn">Cancel</a>
        </div>
    </main>
</body>
</html>
